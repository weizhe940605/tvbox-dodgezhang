name: 每天从上游同步

于:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 执行
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游仓库
        run: |
          git remote add upstream https://github.com/DodgeZhang/tvbox.git || true
          git fetch upstream main

      - name: 检查是否有新更新
        id: check
        run: |
          if git rev-list --left-right --count origin/main...upstream/main | awk '{print $2}' | grep -q '[1-9]'; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "检测到上游有更新"
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "上游无更新"
          fi

      - name: 合并上游更新
        if: steps.check.outputs.has_update == 'true'
        run: |
          git checkout main
          git merge upstream/main -m "chore: sync upstream updates"

      - name: 推送到 GitHub
        if: steps.check.outputs.has_update == 'true'
        run: |
          git push origin main

      - name: 结束通知
        run: |
          echo "同步任务已完成。"
